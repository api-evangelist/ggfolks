name: GGFolks
description: >-
  GGFolks (Good Game Folks) is a small, experimental independent game-development
  group that publishes its work as open source on GitHub under the ggfolks
  organization, with the tagline "We make good feels." Its repositories are early-stage
  games and supporting tooling rather than a commercial API product: platform is a
  TypeScript social-multiplayer web game framework (the `tfw` package, MIT-licensed),
  moncher is a monster-ranching social game, spaced is a web-based space editor,
  chatapp is a Dart messaging experiment, and ggdobj/esl provide shared C#/Unity
  client-server and simulation code. GGFolks does not publish a public developer
  portal, hosted API, OpenAPI definition, or released client SDK, so it is tracked in
  the API Evangelist network as a company profile with no API surface to enrich.
